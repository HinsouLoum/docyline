spring.application.name=docyline


# =========================================================================
# Configuration de l'application Docyline
# =========================================================================

server.port=8080

# --- Base de donnees relationnelle (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/labo_academy_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update : cree/complete les tables automatiquement a partir des entites
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Upload des fichiers PDF (taille max) ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# =========================================================================
# Parametres personnalises de l'application
# =========================================================================

# Cle secrete utilisee pour signer les tokens JWT (a stocker en variable d'environnement en production)
app.jwt.secret=h6l4g11
# Duree de validite du token en millisecondes (24h)
app.jwt.expiration-ms=86400000

# Dossier de stockage des fichiers PDF et images sur le serveur
app.documents.storage-path=./storage/documents

app.cors.allowed-origins=http://localhost:4200

# --- Documentation Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
